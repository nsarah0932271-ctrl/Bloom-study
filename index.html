<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7e9f1">
<title>Bloom Study — N_Sarah</title>
<style>
:root{--pink:#e96ca8;--rose:#f8dce9;--lav:#eee7ff;--ink:#30263a;--muted:#84778b;--paper:#fffafd;--line:#f0dfeb;--green:#2f956b;--red:#c65372}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff8fc,#f5f0ff 55%,#fff9f4);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:11px 15px;font-weight:700;transition:.15s}button:active{transform:scale(.98)}.primary{background:var(--pink);color:white;box-shadow:0 7px 18px #e96ca82e}.soft{background:#f8e8f1;color:#9d4775}.plain{background:white;border:1px solid var(--line);color:var(--ink)}.danger{background:#fff0f3;color:var(--red)}.app{max-width:1100px;margin:auto;padding:18px 18px 90px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:10px}.logo{width:44px;height:44px;border-radius:15px;background:linear-gradient(140deg,#f8a8cb,#b9a3ff);display:grid;place-items:center;font-size:23px;box-shadow:0 7px 20px #d99bc94a}.brand h1{font-size:20px;margin:0}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}.userpill{background:#fff;border:1px solid var(--line);border-radius:99px;padding:8px 12px;font-weight:700;font-size:13px}.hero{padding:25px;border-radius:25px;background:linear-gradient(120deg,#ffe3ef,#f0e9ff);position:relative;overflow:hidden;margin-bottom:18px}.hero:after{content:"✿";position:absolute;font-size:120px;right:24px;top:-12px;color:#fff8;transform:rotate(14deg)}.eyebrow{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-weight:800;color:#a34d7d}.hero h2{font-size:clamp(25px,5vw,36px);line-height:1.12;margin:8px 0}.hero p{color:#725f79;max-width:560px;margin:8px 0 17px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0 22px}.stat,.panel,.subject,.testcard{background:#fffdfd;border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:0 6px 20px #5a2a4d08}.stat .num{font-size:26px;font-weight:850}.stat .label{font-size:12px;color:var(--muted)}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:25px 0 12px}.sectionhead h3{margin:0;font-size:18px}.subjects{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.subject{padding:16px;cursor:pointer;text-align:left;min-height:120px;position:relative;overflow:hidden}.subject:hover{transform:translateY(-2px);border-color:#edb6d1}.subject .emoji{font-size:26px}.subject h4{margin:10px 0 4px;font-size:14px}.subject p{margin:0;font-size:11px;color:var(--muted)}.subject .dot{position:absolute;right:14px;top:14px;width:8px;height:8px;border-radius:50%;background:var(--pink)}.grid2{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.panel h3{margin:0 0 13px;font-size:16px}.muted{color:var(--muted);font-size:13px}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}.field label{font-size:12px;font-weight:750;color:#6e5a70}.field input,.field select,.field textarea{width:100%;border:1px solid #eadbe7;background:#fff;border-radius:12px;padding:11px;color:var(--ink);outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--pink);box-shadow:0 0 0 3px #e96ca81c}.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.hide{display:none!important}.testlist{display:grid;gap:9px}.testrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:white}.testrow strong{display:block;font-size:13px}.testrow small{color:var(--muted)}.pill{font-size:11px;font-weight:800;background:#f7e8f1;color:#a14b7a;padding:5px 8px;border-radius:99px;white-space:nowrap}.bar{height:9px;background:#f1e6ef;border-radius:99px;overflow:hidden}.bar span{height:100%;display:block;background:linear-gradient(90deg,#f18bb9,#a79aff);border-radius:99px}.chart{width:100%;height:180px;display:block}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:4px}.tab{white-space:nowrap;background:white;border:1px solid var(--line);color:var(--muted)}.tab.active{background:var(--ink);color:white}.quizwrap{max-width:720px;margin:0 auto}.quiztop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0 18px}.timer{font-variant-numeric:tabular-nums;font-weight:850;background:#fff0f5;border:1px solid #f5c6dc;padding:9px 13px;border-radius:13px;color:#b4487b}.qcard{background:white;border:1px solid var(--line);border-radius:24px;padding:clamp(18px,4vw,30px);box-shadow:0 10px 30px #5326460d}.qmeta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}.qcard h2{font-size:clamp(20px,4vw,26px);line-height:1.3;margin:22px 0}.option{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;background:#fffafd;border:1px solid #efdfeb;padding:14px;border-radius:14px;margin:9px 0;font-weight:550;color:var(--ink)}.option .letter{width:25px;height:25px;flex-shrink:0;border-radius:8px;background:#f7e5ef;display:grid;place-items:center;font-size:12px;font-weight:850}.option.selected{border-color:var(--pink);background:#fff0f7;box-shadow:0 0 0 2px #e96ca81a}.option.selected .letter{background:var(--pink);color:white}.qfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:20px}.tiny{font-size:11px;color:var(--muted)}.resultscore{font-size:45px;font-weight:900;letter-spacing:-2px}.reviewitem{border:1px solid var(--line);border-radius:15px;padding:14px;margin:10px 0;background:white}.correct{color:var(--green);font-weight:800}.wrong{color:var(--red);font-weight:800}.notice{padding:12px 14px;background:#fff5fa;border:1px solid #f4d5e4;border-radius:14px;font-size:12px;color:#81546e}.bottomnav{position:fixed;bottom:0;left:0;right:0;background:#fffbfeec;backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:7px;padding:10px;z-index:5}.bottomnav button{background:transparent;color:var(--muted);font-size:12px;padding:8px 13px}.bottomnav button.active{background:#f9e4ef;color:#a34677}.empty{text-align:center;padding:28px 10px;color:var(--muted)}.empty span{font-size:30px}.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#34283d;color:white;padding:12px 17px;border-radius:14px;z-index:20;box-shadow:0 8px 25px #0002;font-size:13px}
@media(max-width:760px){.subjects{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:13px}.stat .num{font-size:22px}.hero{padding:21px}.hero:after{right:-8px;top:0;font-size:90px}.top{align-items:flex-start}.userpill{font-size:11px}.app{padding:13px 13px 90px}.testrow{align-items:flex-start}.bottomnav{justify-content:space-around}.bottomnav button{padding:8px 7px}}
</style>
</head>
<body>
<div class="app" id="app">
<header class="top">
 <div class="brand"><div class="logo">✿</div><div><h1>Bloom Study</h1><p>Ton espace pour progresser, un test à la fois</p></div></div>
 <div class="userpill">♡ N_Sarah</div>
</header>
<main id="main"></main>
</div>
<nav class="bottomnav" id="nav">
<button data-page="home" class="active">⌂ Accueil</button><button data-page="tests">✎ Mes tests</button><button data-page="progress">↗ Progression</button><button data-page="settings">⚙ Espace</button>
</nav>
<div id="toast" class="toast hide"></div>
<script>
const SUBJECTS=[
 {name:"Mathématiques",emoji:"📐",color:"#f9ddeb"},{name:"Géopolitique",emoji:"🌍",color:"#e4e9ff"},
 {name:"Économie",emoji:"📈",color:"#e0f4e9"},{name:"Anglais",emoji:"🇬🇧",color:"#fff0d9"},
 {name:"Informatique",emoji:"💻",color:"#e0f3fb"},{name:"Français",emoji:"📚",color:"#f4e5ff"},
 {name:"Philosophie",emoji:"💭",color:"#ffe5e0"}
];
const KEY="bloomStudy.v1";
let data=JSON.parse(localStorage.getItem(KEY)||"null")||{profile:"N_Sarah",users:["N_Sarah"],tests:[],results:[],draft:null};
let page="home",filterSubject="Toutes",quiz=null,tick=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function toast(msg){let t=$("#toast");t.textContent=msg;t.classList.remove("hide");setTimeout(()=>t.classList.add("hide"),2200)}
function subjectEmoji(n){return SUBJECTS.find(s=>s.name===n)?.emoji||"✿"}
function dateText(v){try{return new Date(v).toLocaleDateString("fr-FR",{day:"2-digit",month:"short",year:"numeric"})}catch{return v||""}}
function avg(){if(!data.results.length)return 0;return data.results.reduce((a,r)=>a+r.percent,0)/data.results.length}
function render(){
 $("#nav").classList.toggle("hide",page==="quiz"||page==="result");
 document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page||page==="result"&&b.dataset.page==="tests"));
 if(page==="home")home();else if(page==="tests")testsPage();else if(page==="progress")progressPage();else if(page==="settings")settingsPage();else if(page==="quiz")quizPage();else if(page==="result")resultPage();
}
function home(){
 const recent=[...data.results].reverse().slice(0,3);
 $("#main").innerHTML=`
 <section class="hero"><div class="eyebrow">Ton petit coin de réussite ✨</div><h2>Chaque effort compte,<br>Sarah.</h2><p>Organise tes révisions, entraîne-toi en conditions de test et observe tes progrès matière par matière.</p><button class="primary" onclick="page='tests';render()">Commencer un test →</button></section>
 <section class="stats"><div class="stat"><div class="num">${data.results.length}</div><div class="label">Tests terminés</div></div><div class="stat"><div class="num">${data.results.length?avg().toFixed(1)+"%":"—"}</div><div class="label">Moyenne générale</div></div><div class="stat"><div class="num">${new Set(data.results.map(r=>r.subject)).size}/7</div><div class="label">Matières travaillées</div></div></section>
 <div class="sectionhead"><h3>Choisis ta matière</h3><span class="muted">7 matières</span></div>
 <div class="subjects">${SUBJECTS.map(s=>`<button class="subject" style="background:linear-gradient(145deg,#fff,${s.color})" onclick="selectSubject('${s.name}')"><span class="dot"></span><span class="emoji">${s.emoji}</span><h4>${s.name}</h4><p>${data.results.filter(r=>r.subject===s.name).length} test(s) passé(s)</p></button>`).join("")}</div>
 <div class="grid2" style="margin-top:18px"><section class="panel"><h3>Derniers résultats 🌸</h3>${recent.length?`<div class="testlist">${recent.map(r=>`<div class="testrow"><div><strong>${esc(r.title)}</strong><small>${esc(r.subject)} · ${dateText(r.date)}</small></div><span class="pill">${r.score.toFixed(1)}/${r.max}</span></div>`).join("")}</div>`:`<div class="empty"><span>📝</span><p>Ton premier résultat apparaîtra ici.</p></div>`}</section>
 <section class="panel"><h3>Ton objectif du moment</h3><p class="muted">La régularité vaut mieux qu'une longue séance isolée.</p><div class="bar"><span style="width:${Math.min(100,data.results.length*10)}%"></span></div><p class="muted">${data.results.length} test(s) enregistré(s). Continue à ton rythme 💗</p><button class="soft" onclick="page='progress';render()">Voir ma progression</button></section></div>`;
}
function selectSubject(s){filterSubject=s;page="tests";render()}
function testsPage(){
 $("#main").innerHTML=`<div class="sectionhead"><div><div class="eyebrow">Bibliothèque</div><h2 style="margin:4px 0">Mes tests & leçons</h2></div><button class="primary" onclick="newTest()">＋ Créer un test</button></div>
 <div class="panel" style="margin-bottom:15px"><div class="row"><div class="field"><label>Matière</label><select id="subjectFilter" onchange="filterSubject=this.value;testsPage()"><option ${filterSubject==="Toutes"?"selected":""}>Toutes</option>${SUBJECTS.map(s=>`<option ${filterSubject===s.name?"selected":""}>${s.name}</option>`).join("")}</select></div><div class="field"><label>Recherche</label><input id="searchTest" placeholder="Titre ou leçon…" oninput="filterTestRows()"></div></div><p class="muted">Crée ton propre QCM, indique la leçon, la date et la durée. Pendant le test, tu ne peux ni revenir en arrière ni passer une question sans choisir.</p></div>
 <div id="testRows" class="testlist"></div>`;
 filterTestRows();
}
function filterTestRows(){
 let box=$("#testRows");if(!box)return;
 let q=($("#searchTest")?.value||"").toLowerCase(),s=filterSubject;
 let arr=data.tests.filter(t=>(s==="Toutes"||t.subject===s)&&(`${t.title} ${t.lesson}`.toLowerCase().includes(q)));
 box.innerHTML=arr.length?arr.map(t=>`<div class="testrow"><div style="min-width:0"><strong>${subjectEmoji(t.subject)} ${esc(t.title)}</strong><small>${esc(t.subject)} · ${esc(t.lesson||"Leçon non précisée")} · ${t.questions.length} question(s) · ${t.duration} min</small></div><div class="actions" style="margin:0"><button class="primary" onclick="startQuiz('${t.id}')">Démarrer</button><button class="plain" onclick="editTest('${t.id}')">Modifier</button><button class="danger" onclick="deleteTest('${t.id}')">×</button></div></div>`).join(""):`<div class="panel empty"><span>🌷</span><p>Aucun test ici pour le moment.</p><button class="soft" onclick="newTest()">Créer mon premier test</button></div>`;
}
function newTest(){
 data.draft={id:"t"+Date.now(),title:"",subject:filterSubject==="Toutes"?"Mathématiques":filterSubject,lesson:"",date:new Date().toISOString().slice(0,10),duration:30,questions:[]};
 page="editor";editorPage();
}
function editTest(id){data.draft=JSON.parse(JSON.stringify(data.tests.find(t=>t.id===id)));page="editor";editorPage()}
function editorPage(){
 $("#nav").classList.add("hide");let d=data.draft;
 $("#main").innerHTML=`<button class="plain" onclick="page='tests';render()">← Retour aux tests</button><div class="sectionhead"><div><div class="eyebrow">Création personnalisée</div><h2 style="margin:4px 0">Construis ton QCM ✨</h2></div></div>
 <div class="panel"><div class="row"><div class="field"><label>Titre du test</label><input id="tTitle" value="${esc(d.title)}" placeholder="Ex. Fonctions usuelles"></div><div class="field"><label>Matière</label><select id="tSubject">${SUBJECTS.map(s=>`<option ${d.subject===s.name?"selected":""}>${s.name}</option>`).join("")}</select></div></div>
 <div class="row"><div class="field"><label>Leçon / chapitre</label><input id="tLesson" value="${esc(d.lesson)}" placeholder="Ex. Périodicité"></div><div class="field"><label>Date du test</label><input id="tDate" type="date" value="${esc(d.date)}"></div><div class="field"><label>Durée (minutes)</label><input id="tDuration" type="number" min="1" max="240" value="${d.duration}"></div></div>
 <div class="notice">Barème : +1 par bonne réponse, −0,5 par mauvaise réponse, 0 si la question est laissée sans réponse à la fin du temps. Pour une question à plusieurs réponses, le point est partagé entre les bonnes options trouvées ; une mauvaise option cochée entraîne une pénalité partagée.</div>
 <div class="sectionhead"><h3>Questions <span class="pill" id="qCount">${d.questions.length}</span></h3><button class="soft" onclick="addQuestion()">＋ Ajouter</button></div>
 <div id="questionEditor">${d.questions.map((q,i)=>questionForm(q,i)).join("")}</div>
 <div class="actions"><button class="primary" onclick="saveTest()">Enregistrer le test</button><button class="plain" onclick="addQuestion()">＋ Ajouter une question</button></div></div>`;
}
function questionForm(q,i){
 return `<div class="reviewitem" data-q="${i}"><div class="sectionhead" style="margin:0 0 10px"><h3>Question ${i+1}</h3><button class="danger" onclick="removeQuestion(${i})">Supprimer</button></div>
 <div class="field"><label>Énoncé</label><textarea id="qtext${i}" rows="2" placeholder="Écris la question…">${esc(q.text)}</textarea></div>
 <div class="row"><div class="field"><label>Type de question</label><select id="qtype${i}" onchange="toggleCorrectMode(${i})"><option value="single" ${q.type==="single"?"selected":""}>Une seule bonne réponse</option><option value="multi" ${q.type==="multi"?"selected":""}>Plusieurs bonnes réponses</option></select></div><div class="field"><label>Difficulté</label><select id="qdif${i}"><option ${q.difficulty==="Medium"?"selected":""}>Medium</option><option ${q.difficulty==="Hard"?"selected":""}>Hard</option></select></div></div>
 <div class="field"><label>Options (sélectionne la/les bonne(s) réponse(s))</label><div id="opts${i}">${q.options.map((o,j)=>`<div class="row" style="align-items:center;margin:6px 0"><label style="display:flex;align-items:center;gap:7px;flex:0 0 auto"><input type="${q.type==="multi"?"checkbox":"radio"}" name="correct${i}" value="${j}" ${q.correct.includes(j)?"checked":""}></label><input id="opt${i}_${j}" value="${esc(o)}" placeholder="Option ${j+1}"><button class="danger" onclick="removeOption(${i},${j})">×</button></div>`).join("")}</div><button class="plain" onclick="addOption(${i})">＋ Ajouter une option</button></div>
 <div class="field"><label>Explication (facultatif)</label><textarea id="qexp${i}" rows="2" placeholder="Explique la bonne méthode…">${esc(q.explanation||"")}</textarea></div></div>`;
}
function collectQuestions(){
 let out=[];for(let i=0;i<data.draft.questions.length;i++){
 let old=data.draft.questions[i],text=$("#qtext"+i)?.value||"",type=$("#qtype"+i)?.value||"single",opts=old.options.map((_,j)=>$("#opt"+i+"_"+j)?.value||"");
 let correct=[...document.querySelectorAll(`[name="correct${i}"]:checked`)].map(e=>Number(e.value));
 out.push({...old,text,type,options:opts,correct:correct.filter(j=>j<opts.length),difficulty:$("#qdif"+i)?.value||"Medium",explanation:$("#qexp"+i)?.value||""});
 }return out;
}
function syncDraft(){data.draft.questions=collectQuestions()}
function addQuestion(){syncDraft();data.draft.questions.push({text:"",type:"single",options:["","","",""],correct:[],difficulty:"Medium",explanation:""});editorPage()}
function removeQuestion(i){syncDraft();data.draft.questions.splice(i,1);editorPage()}
function addOption(i){syncDraft();data.draft.questions[i].options.push("");editorPage()}
function removeOption(i,j){syncDraft();if(data.draft.questions[i].options.length<=2){toast("Garde au moins deux options.");return}data.draft.questions[i].options.splice(j,1);data.draft.questions[i].correct=data.draft.questions[i].correct.filter(k=>k!==j).map(k=>k>j?k-1:k);editorPage()}
function toggleCorrectMode(i){syncDraft();data.draft.questions[i].type=$("#qtype"+i).value;data.draft.questions[i].correct=[];editorPage()}
function saveTest(){
 syncDraft();let d=data.draft;d.title=$("#tTitle").value.trim();d.subject=$("#tSubject").value;d.lesson=$("#tLesson").value.trim();d.date=$("#tDate").value;d.duration=Math.max(1,Math.min(240,Number($("#tDuration").value)||30));
 if(!d.title){toast("Ajoute un titre au test.");return}if(!d.questions.length){toast("Ajoute au moins une question.");return}
 for(let i=0;i<d.questions.length;i++){let q=d.questions[i];if(!q.text.trim()||q.options.filter(o=>o.trim()).length<2||!q.correct.length){toast(`Vérifie la question ${i+1} : énoncé, options et bonne réponse.`);return}if(q.correct.some(j=>!q.options[j]?.trim())){toast(`Une bonne réponse de la question ${i+1} est vide.`);return}}
 d.questions.forEach(q=>q.options=q.options.map(o=>o.trim()));let idx=data.tests.findIndex(t=>t.id===d.id);if(idx>=0)data.tests[idx]=d;else data.tests.push(d);data.draft=null;save();page="tests";render();toast("Test enregistré avec succès 💗");
}
function deleteTest(id){if(!confirm("Supprimer ce test ? Les résultats déjà enregistrés seront conservés."))return;data.tests=data.tests.filter(t=>t.id!==id);save();render()}
function startQuiz(id){
 let t=data.tests.find(t=>t.id===id);if(!t)return;
 quiz={test:JSON.parse(JSON.stringify(t)),index:0,answers:[],remaining:t.duration*60,started:Date.now()};
 page="quiz";render();startTimer();
}
function startTimer(){clearInterval(tick);tick=setInterval(()=>{if(!quiz)return;quiz.remaining--;let el=$("#timer");if(el)el.textContent=fmtTime(quiz.remaining);if(quiz.remaining<=0){clearInterval(tick);finishQuiz(true)}},1000)}
function fmtTime(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function quizPage(){
 let q=quiz.test.questions[quiz.index],chosen=quiz.answers[quiz.index]||[];
 $("#main").innerHTML=`<div class="quizwrap"><button class="plain" onclick="confirmQuit()">✕ Quitter le test</button><div class="quiztop"><div><div class="eyebrow">${esc(quiz.test.subject)} · ${esc(quiz.test.lesson||quiz.test.title)}</div><strong>Question ${quiz.index+1} sur ${quiz.test.questions.length}</strong></div><div id="timer" class="timer">${fmtTime(quiz.remaining)}</div></div>
 <div class="bar"><span style="width:${(quiz.index/quiz.test.questions.length)*100}%"></span></div>
 <section class="qcard" style="margin-top:15px"><div class="qmeta"><span>${q.type==="multi"?"☑ Plusieurs réponses possibles":"◉ Une seule réponse"}</span><span class="pill">${q.difficulty||"Medium"}</span></div><h2>${esc(q.text)}</h2>
 <div>${q.options.map((o,i)=>`<button class="option ${chosen.includes(i)?"selected":""}" onclick="chooseAnswer(${i})"><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`).join("")}</div>
 <div class="qfoot"><span class="tiny">Une fois validée, tu ne pourras pas revenir en arrière.</span><button class="primary" onclick="nextQuestion()" ${chosen.length?"":"disabled style='opacity:.45;cursor:not-allowed'"}>${quiz.index===quiz.test.questions.length-1?"Terminer le test":"Valider et continuer →"}</button></div></section>
 <p class="tiny" style="text-align:center;margin-top:13px">Réponds à chaque question avant de continuer. Le test se termine automatiquement à zéro.</p></div>`;
}
function chooseAnswer(i){let q=quiz.test.questions[quiz.index],chosen=quiz.answers[quiz.index]||[];if(q.type==="multi"){chosen=chosen.includes(i)?chosen.filter(x=>x!==i):[...chosen,i]}else chosen=[i];quiz.answers[quiz.index]=chosen;quizPage()}
function nextQuestion(){if(!(quiz.answers[quiz.index]||[]).length)return;if(quiz.index<quiz.test.questions.length-1){quiz.index++;quizPage()}else finishQuiz(false)}
function confirmQuit(){if(confirm("Quitter maintenant ? Le test ne sera pas noté.")){clearInterval(tick);quiz=null;page="tests";render()}}
function grade(q,ans){
 let good=q.correct, picked=ans||[];
 if(!picked.length)return {score:0,kind:"blank"};
 if(q.type!=="multi")return {score:picked.length===1&&good.includes(picked[0])?1:-.5,kind:picked.length===1&&good.includes(picked[0])?"correct":"wrong"};
 let per=1/good.length,score=0;
 picked.forEach(i=>{score+=good.includes(i)?per:-.5/Math.max(1,q.options.length-good.length)});
 score=Math.max(-.5,Math.min(1,score));
 return {score,kind:score>=.999?"correct":score>0?"partial":"wrong"};
}
function finishQuiz(timeout){
 clearInterval(tick);let t=quiz.test,items=t.questions.map((q,i)=>({...q,answer:quiz.answers[i]||[],grading:grade(q,quiz.answers[i]||[])}));
 let score=items.reduce((a,q)=>a+q.grading.score,0),max=t.questions.length,percent=Math.max(0,score/max*100);
 let result={id:"r"+Date.now(),testId:t.id,title:t.title,subject:t.subject,lesson:t.lesson,date:new Date().toISOString(),score,max,percent,timeout,items,duration:t.duration,elapsed:Math.round((Date.now()-quiz.started)/1000)};
 data.results.push(result);save();quiz=null;window.lastResult=result;page="result";render();
}
function resultPage(){
 let r=window.lastResult||data.results[data.results.length-1];if(!r){page="home";render();return}
 $("#main").innerHTML=`<div class="quizwrap"><section class="hero"><div class="eyebrow">Test terminé ✨</div><h2>Bravo d'être allée jusqu'au bout !</h2><p>${r.timeout?"Le temps est écoulé.":"Prends un instant pour comprendre tes erreurs : c'est là que tu progresses."}</p><div class="resultscore">${r.score.toFixed(2)}<span style="font-size:18px;letter-spacing:0"> / ${r.max}</span></div><p style="font-weight:800;color:#9a4775">${r.percent.toFixed(1)}% de réussite · ${r.items.filter(q=>q.grading.kind==="correct").length} bonne(s) réponse(s) exacte(s)</p></section>
 <div class="stats"><div class="stat"><div class="num" style="color:var(--green)">${r.items.filter(q=>q.grading.kind==="correct").length}</div><div class="label">Correctes</div></div><div class="stat"><div class="num" style="color:var(--red)">${r.items.filter(q=>q.grading.kind==="wrong").length}</div><div class="label">Incorrectes</div></div><div class="stat"><div class="num">${r.items.filter(q=>q.grading.kind==="blank").length}</div><div class="label">Sans réponse</div></div></div>
 <section class="panel"><h3>Correction détaillée 📝</h3><p class="muted">Barème appliqué : +1 bonne réponse, −0,5 mauvaise réponse. Les réponses multiples ont un crédit partiel.</p>${r.items.map((q,i)=>`<div class="reviewitem"><div class="qmeta"><strong>Question ${i+1}</strong><span class="${q.grading.score>0?"correct":q.grading.score<0?"wrong":""}">${q.grading.score>0?"+":""}${q.grading.score.toFixed(2)} point(s)</span></div><p><strong>${esc(q.text)}</strong></p><p class="muted">Ta réponse : ${q.answer.length?q.answer.map(j=>esc(q.options[j])).join(", "):"Aucune réponse"}</p><p class="correct">Bonne(s) réponse(s) : ${q.correct.map(j=>esc(q.options[j])).join(", ")}</p>${q.explanation?`<p>${esc(q.explanation)}</p>`:""}<p class="muted"><strong>Tip :</strong> ${q.grading.kind==="correct"?"Bonne méthode : continue à vérifier pourquoi la réponse est juste.":q.grading.kind==="blank"?"Si tu hésites, élimine d'abord les propositions manifestement fausses.":"Relis la notion du cours liée à cette question, puis refais-la sans regarder la correction."}</p></div>`).join("")}</section>
 <div class="actions"><button class="primary" onclick="page='progress';render()">Voir ma courbe ↗</button><button class="plain" onclick="page='tests';render()">Retour aux tests</button><button class="soft" onclick="window.print()">Imprimer la correction</button></div></div>`;
}
function progressPage(){
 let subjects=SUBJECTS.map(s=>({name:s.name,results:data.results.filter(r=>r.subject===s.name)}));
 let active=subjects.filter(s=>s.results.length);
 $("#main").innerHTML=`<div class="sectionhead"><div><div class="eyebrow">Tes efforts prennent forme</div><h2 style="margin:4px 0">Ma progression 🌱</h2></div></div>
 <div class="stats"><div class="stat"><div class="num">${data.results.length}</div><div class="label">Tests enregistrés</div></div><div class="stat"><div class="num">${data.results.length?avg().toFixed(1)+"%":"—"}</div><div class="label">Moyenne des réussites</div></div><div class="stat"><div class="num">${active.length}</div><div class="label">Matières commencées</div></div></div>
 <section class="panel"><h3>Courbe de progression par matière</h3><div class="field"><label>Choisir une matière</label><select id="chartSubject" onchange="drawChart()"><option value="Toutes">Toutes les matières</option>${SUBJECTS.map(s=>`<option>${s.name}</option>`).join("")}</select></div><canvas class="chart" id="progressChart"></canvas><p class="muted">Chaque point correspond à un test terminé. Les résultats sont enregistrés dans ce navigateur.</p></section>
 <div class="sectionhead"><h3>Détail par matière</h3></div><div class="testlist">${subjects.map(s=>`<div class="testrow"><div><strong>${subjectEmoji(s.name)} ${s.name}</strong><small>${s.results.length} test(s) · ${s.results.length?s.results.map(r=>r.percent.toFixed(0)+"%").join(" → "):"Pas encore de résultat"}</small></div><span class="pill">${s.results.length?(s.results.reduce((a,r)=>a+r.percent,0)/s.results.length).toFixed(1)+"%":"—"}</span></div>`).join("")}</div>`;
 drawChart();
}
function drawChart(){
 let c=$("#progressChart");if(!c)return;let ctx=c.getContext("2d"),w=c.clientWidth||600,h=180,ratio=window.devicePixelRatio||1;c.width=w*ratio;c.height=h*ratio;ctx.scale(ratio,ratio);ctx.clearRect(0,0,w,h);
 let s=$("#chartSubject")?.value||"Toutes",rs=data.results.filter(r=>s==="Toutes"||r.subject===s);if(!rs.length){ctx.fillStyle="#95869a";ctx.font="13px system-ui";ctx.textAlign="center";ctx.fillText("Tes résultats apparaîtront ici après ton premier test 💗",w/2,h/2);return}
 let pad={l:35,r:12,t:15,b:25},cw=w-pad.l-pad.r,ch=h-pad.t-pad.b;
 ctx.strokeStyle="#f0e3ed";ctx.lineWidth=1;for(let i=0;i<=4;i++){let y=pad.t+ch*i/4;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();ctx.fillStyle="#95869a";ctx.font="10px system-ui";ctx.textAlign="right";ctx.fillText(String(100-i*25),pad.l-7,y+3)}
 let vals=rs.map(r=>Math.max(0,Math.min(100,r.percent))),x=i=>pad.l+(vals.length===1?cw/2:i*cw/(vals.length-1)),y=v=>pad.t+ch*(1-v/100);
 ctx.beginPath();vals.forEach((v,i)=>i?ctx.lineTo(x(i),y(v)):ctx.moveTo(x(i),y(v)));ctx.strokeStyle="#e96ca8";ctx.lineWidth=3;ctx.lineJoin="round";ctx.stroke();
 vals.forEach((v,i)=>{ctx.beginPath();ctx.arc(x(i),y(v),4,0,Math.PI*2);ctx.fillStyle="#e96ca8";ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.stroke()});
}
function settingsPage(){
 $("#main").innerHTML=`<div class="sectionhead"><div><div class="eyebrow">Personnalisation</div><h2 style="margin:4px 0">Mon espace 💗</h2></div></div>
 <section class="panel"><h3>Profil</h3><div class="field"><label>Nom affiché</label><input id="profileName" value="${esc(data.profile)}" maxlength="35"></div><button class="primary" onclick="saveProfile()">Enregistrer mon nom</button><p class="muted">Les données sont enregistrées localement sur cet appareil et dans ce navigateur. Ce prototype ne synchronise pas encore les résultats entre plusieurs appareils.</p></section>
 <section class="panel" style="margin-top:14px"><h3>Créer / changer d'espace</h3><p class="muted">Chaque profil sur cet appareil dispose de son propre historique. Pour l'instant, ces espaces sont locaux et ne sont pas protégés par un mot de passe.</p><div class="row"><div class="field"><label>Nom du nouvel espace</label><input id="newProfile" placeholder="Ex. Aminata"></div><button class="soft" style="align-self:end;margin-bottom:10px" onclick="createProfile()">＋ Créer</button></div><div class="field"><label>Espaces enregistrés sur cet appareil</label><select id="profileSelect">${data.users.map(u=>`<option ${u===data.profile?"selected":""}>${esc(u)}</option>`).join("")}</select></div><button class="plain" onclick="switchProfile()">Ouvrir cet espace</button></section>
 <section class="panel" style="margin-top:14px"><h3>Données</h3><p class="muted">Télécharge une copie de tes tests et résultats pour les conserver.</p><div class="actions"><button class="soft" onclick="exportData()">Exporter mes données</button><button class="danger" onclick="resetData()">Effacer cet espace</button></div></section>`;
}
function saveProfile(){data.profile=$("#profileName").value.trim()||"N_Sarah";if(!data.users.includes(data.profile))data.users.push(data.profile);save();render();toast("Profil mis à jour.")}
function createProfile(){let n=$("#newProfile").value.trim();if(!n){toast("Choisis un nom d'espace.");return}if(!data.users.includes(n))data.users.push(n);data.profile=n;data.tests=[];data.results=[];save();render();toast("Nouvel espace créé.")}
function switchProfile(){let n=$("#profileSelect").value;if(n===data.profile)return;data.profile=n;data.tests=[];data.results=[];save();render();toast("Espace ouvert.")}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="bloom-study-"+data.profile+".json";a.click();URL.revokeObjectURL(a.href)}
function resetData(){if(!confirm("Effacer tous les tests et résultats de cet espace ? Cette action est irréversible."))return;data.tests=[];data.results=[];save();render();toast("Espace vidé.")}
$("#nav").addEventListener("click",e=>{let b=e.target.closest("button[data-page]");if(!b)return;page=b.dataset.page;filterSubject="Toutes";render()});
window.addEventListener("resize",()=>{if(page==="progress")drawChart()});
const oldRender=render;
render=function(){if(page==="editor"){editorPage();return}oldRender()};
render();
</script>
</body></html>
